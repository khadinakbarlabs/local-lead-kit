<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Field Guide · Looksy</title>
<style>
:root{color-scheme:dark;--ink:#fff9ec;--muted:#d7cfea;--bg:#26223f;--accent:#deff89}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:48px 24px}small,label{font-weight:700;letter-spacing:.06em;color:var(--accent)}h1{font-size:clamp(38px,7vw,72px);line-height:1.04;letter-spacing:-.06em;margin:18px 0}p{max-width:780px;color:var(--muted)}header{padding-bottom:24px;border-bottom:1px solid #625974}section{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}label{display:grid;gap:6px}input,select,button{font:inherit;color:var(--ink);background:#36304e;border:1px solid #786d90;border-radius:8px;padding:10px}button,a{cursor:pointer}button:hover,button:focus,a:hover{color:var(--accent)}ul{padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:12px;list-style:none}li{background:#36304e;padding:18px;border-radius:12px}li a{display:block;color:#fff;font-weight:660;text-decoration:none}li span{font-size:.8em;color:var(--muted)}#more[hidden]{display:none}
.lockup{display:inline-flex;align-items:center;gap:.4em;font:700 29px/1 system-ui;letter-spacing:-.05em;color:var(--ink)}.lockup svg{width:40px;height:40px}.section-tag{margin-left:18px;border-left:1px solid #6e6384;padding-left:16px}header small{display:flex;align-items:center}</style><main><header><small><span class="lockup">__MARK__ Looksy</span><span class="section-tag">FIELD GUIDE</span></small><h1>What do you want<br>to research?</h1><p>Browse public Apify Actors by task. Open a listing to see its current details, or ask your agent to use the Actor by name. Browsing is free; runs use your Apify account.</p></header><section><label>Find a tool<input id="q" type="search" placeholder="Try: backlink, YouTube, humanizer"></label><label>Task area<select id="s"><option value="">All tasks</option></select></label></section><output id="count" aria-live="polite"></output><ul id="list"></ul><button id="more">Show more</button></main>
<script type="application/json" id="data">__INVENTORY__</script>
<script>
const rows=JSON.parse(document.getElementById('data').textContent), by=id=>document.getElementById(id);
let limit=36;
for(const name of [...new Set(rows.flatMap(r=>r.shelves))].sort()){by('s').add(new Option(name.replaceAll('-',' '),name))}
function show(){const words=by('q').value.toLowerCase().trim().split(/\s+/),s=by('s').value;const matches=rows.filter(r=>(!s||r.shelves.includes(s))&&words.every(w=>(r.title+' '+r.slug+' '+r.shelves.join(' ')+' '+r.categories.join(' ')).toLowerCase().replaceAll('-',' ').includes(w)));
by('count').textContent=matches.length+' matching Actors';by('list').replaceChildren();
for(const r of matches.slice(0,limit)){const li=document.createElement('li'),a=document.createElement('a'),tag=document.createElement('span');a.textContent=r.title;a.href='https://apify.com/'+r.slug;a.target='_blank';a.rel='noopener noreferrer';tag.textContent=r.shelves.join(' · ');li.append(a,tag);by('list').append(li)}by('more').hidden=limit>=matches.length}
for(const id of ['q','s'])by(id).addEventListener('input',()=>{limit=36;show()});by('more').onclick=()=>{limit+=36;show()};show();
</script></html>
