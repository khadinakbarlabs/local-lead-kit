<script>
const rows=JSON.parse(document.getElementById('data').textContent), by=id=>document.getElementById(id);
let limit=36;
for(const name of [...new Set(rows.flatMap(r=>r.shelves))].sort()){by('s').add(new Option(name.replaceAll('-',' '),name))}
function show(){const words=by('q').value.toLowerCase().trim().split(/\s+/),s=by('s').value;const matches=rows.filter(r=>(!s||r.shelves.includes(s))&&words.every(w=>(r.title+' '+r.slug+' '+r.shelves.join(' ')+' '+r.categories.join(' ')).toLowerCase().replaceAll('-',' ').includes(w)));
by('count').textContent=matches.length+' matching Actors';by('list').replaceChildren();
for(const r of matches.slice(0,limit)){const li=document.createElement('li'),a=document.createElement('a'),tag=document.createElement('span');a.textContent=r.title;a.href='https://apify.com/'+r.slug;a.target='_blank';a.rel='noopener noreferrer';tag.textContent=r.shelves.join(' · ');li.append(a,tag);by('list').append(li)}by('more').hidden=limit>=matches.length}
for(const id of ['q','s'])by(id).addEventListener('input',()=>{limit=36;show()});by('more').onclick=()=>{limit+=36;show()};show();
</script></html>
