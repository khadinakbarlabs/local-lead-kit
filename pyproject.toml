[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-lead-kit"
version = "0.2.2"
description = "One agent plugin for discovering and using public Apify Actors"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Khadin Akbar"}]
readme = "README.md"

[project.scripts]
local-lead-kit = "local_lead_kit.__main__:main"

[tool.setuptools.packages.find]
include = ["local_lead_kit*"]

[tool.setuptools.package-data]
local_lead_kit = ["static/*", "catalog.json"]
