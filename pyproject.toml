[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looksy"
version = "0.6.0"
description = "One agent plugin for discovering and using public Apify Actors"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Khadin Akbar"}]
readme = "README.md"

[project.scripts]
looksy = "looksy.__main__:main"

[tool.setuptools.packages.find]
include = ["looksy*"]

[tool.setuptools.package-data]
looksy = ["static/*", "catalog.json", "capabilities.json", "routing.json", "workflows.json"]
